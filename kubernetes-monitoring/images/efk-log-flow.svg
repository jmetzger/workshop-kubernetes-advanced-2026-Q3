<svg xmlns="http://www.w3.org/2000/svg" width="760" height="640" viewBox="0 0 760 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#37474f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="760" height="640" fill="#ffffff"/>

  <!-- Node -->
  <rect x="50" y="30" width="660" height="370" rx="10" fill="#eceff1" stroke="#90a4ae" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="80" y="62" font-size="18" font-weight="bold" fill="#455a64">Node</text>

  <!-- Pod / App -->
  <rect x="130" y="80" width="500" height="70" rx="8" fill="#e3f2fd" stroke="#1976d2" stroke-width="2"/>
  <text x="380" y="108" font-size="15" font-weight="bold" fill="#0d47a1" text-anchor="middle">Pod: App-Container</text>
  <text x="380" y="132" font-size="13" fill="#0d47a1" text-anchor="middle">loggt nach stdout/stderr (12-Factor)</text>

  <line x1="380" y1="150" x2="380" y2="178" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Container-Runtime -->
  <rect x="130" y="182" width="500" height="82" rx="8" fill="#fff8e1" stroke="#f9a825" stroke-width="2"/>
  <text x="380" y="210" font-size="15" font-weight="bold" fill="#795500" text-anchor="middle">Container-Runtime (containerd)</text>
  <text x="380" y="232" font-size="13" fill="#795500" text-anchor="middle">schreibt nach /var/log/pods/...</text>
  <text x="380" y="251" font-size="13" fill="#795500" text-anchor="middle">(Symlinks: /var/log/containers/*.log)</text>

  <line x1="380" y1="264" x2="380" y2="292" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Collector -->
  <rect x="130" y="296" width="500" height="82" rx="8" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="380" y="324" font-size="15" font-weight="bold" fill="#1b5e20" text-anchor="middle">Log-Collector (DaemonSet-Pod)</text>
  <text x="380" y="346" font-size="13" fill="#1b5e20" text-anchor="middle">liest die Log-Dateien (tail), ergaenzt Kubernetes-Metadaten</text>
  <text x="380" y="365" font-size="13" fill="#1b5e20" text-anchor="middle">(Namespace, Pod, Labels), puffert</text>

  <line x1="380" y1="400" x2="380" y2="438" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Elasticsearch -->
  <rect x="180" y="442" width="400" height="66" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="2"/>
  <text x="380" y="470" font-size="15" font-weight="bold" fill="#311b92" text-anchor="middle">Elasticsearch</text>
  <text x="380" y="492" font-size="13" fill="#311b92" text-anchor="middle">Indizes, Retention</text>

  <line x1="380" y1="508" x2="380" y2="536" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Kibana -->
  <rect x="180" y="540" width="400" height="66" rx="8" fill="#fce4ec" stroke="#c2185b" stroke-width="2"/>
  <text x="380" y="568" font-size="15" font-weight="bold" fill="#880e4f" text-anchor="middle">Kibana</text>
  <text x="380" y="590" font-size="13" fill="#880e4f" text-anchor="middle">Suche, Filter, Dashboards</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#57606a"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a7f37"/>
    </marker>
  </defs>

  <!-- Hintergrund -->
  <rect x="1" y="1" width="878" height="478" rx="14" fill="#ffffff" stroke="#d0d7de"/>

  <!-- Titel -->
  <text x="440" y="40" text-anchor="middle" font-size="18" font-weight="bold" fill="#24292f">VaultAuth: was bedeuten mount und role?</text>

  <!-- Dein Cluster -->
  <rect x="40" y="110" width="240" height="150" rx="10" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
  <text x="160" y="138" text-anchor="middle" font-size="14" font-weight="bold" fill="#0a3069">Dein Cluster (tln1)</text>
  <rect x="60" y="152" width="200" height="90" rx="6" fill="#ffffff" stroke="#0969da"/>
  <text x="160" y="180" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#24292f">VSO-Controller</text>
  <text x="160" y="200" text-anchor="middle" font-size="11.5" fill="#57606a">ServiceAccount</text>
  <text x="160" y="216" text-anchor="middle" font-size="11.5" fill="#57606a">mariadb-sa</text>

  <!-- Vault-Server -->
  <rect x="420" y="70" width="420" height="360" rx="12" fill="#fff8c5" stroke="#9a6700" stroke-width="2"/>
  <text x="630" y="98" text-anchor="middle" font-size="15" font-weight="bold" fill="#24292f">Vault-Server (gemeinsam)</text>
  <text x="630" y="116" text-anchor="middle" font-size="11.5" fill="#57606a">vault-bka.do.t3isp.de</text>

  <!-- Mount 1 (deiner) -->
  <rect x="445" y="130" width="370" height="120" rx="8" fill="#ffffff" stroke="#9a6700" stroke-width="2"/>
  <text x="630" y="152" text-anchor="middle" font-size="13" font-weight="bold" fill="#24292f">mount: kubernetes-tln1 (DEIN Cluster)</text>
  <text x="630" y="170" text-anchor="middle" font-size="11" fill="#57606a">kennt deinen API-Server, CA + Reviewer-Token (TokenReview)</text>
  <rect x="465" y="184" width="330" height="52" rx="6" fill="#dafbe1" stroke="#1a7f37"/>
  <text x="630" y="204" text-anchor="middle" font-size="12" font-weight="bold" fill="#0f5323">role: mariadb</text>
  <text x="630" y="222" text-anchor="middle" font-size="11" fill="#57606a">erlaubt SA mariadb-sa/default, gibt Policy mariadb-read</text>

  <!-- Mount 2 (anderer TN, ausgegraut) -->
  <g opacity="0.55">
    <rect x="445" y="270" width="370" height="106" rx="8" fill="#ffffff" stroke="#57606a" stroke-dasharray="6 4"/>
    <text x="630" y="292" text-anchor="middle" font-size="13" font-weight="bold" fill="#57606a">mount: kubernetes-tln2 (Cluster von tln2)</text>
    <rect x="465" y="306" width="330" height="52" rx="6" fill="#f6f8fa" stroke="#57606a"/>
    <text x="630" y="326" text-anchor="middle" font-size="12" font-weight="bold" fill="#57606a">role: mariadb - genauso konfiguriert</text>
    <text x="630" y="344" text-anchor="middle" font-size="11" fill="#57606a">aber eine eigene Rolle im eigenen Mount</text>
  </g>
  <text x="630" y="404" text-anchor="middle" font-size="11.5" font-style="italic" fill="#57606a">... ein Mount pro Teilnehmer - er zeigt immer auf genau EIN Cluster</text>

  <!-- Pfeil Login -->
  <line x1="284" y1="160" x2="439" y2="160" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="360" y="131" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#24292f">1) Login mit SA-Token</text>
  <text x="360" y="147" text-anchor="middle" font-size="11.5" fill="#57606a">+ Rollenname mariadb</text>

  <!-- Pfeil Antwort -->
  <line x1="439" y1="230" x2="284" y2="230" stroke="#1a7f37" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="355" y="252" text-anchor="middle" font-size="11" font-weight="bold" fill="#1a7f37">2) Vault-Token mit</text>
  <text x="355" y="267" text-anchor="middle" font-size="11" fill="#1a7f37">Policy mariadb-read</text>

  <!-- Merksatz -->
  <text x="440" y="462" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#24292f">mount = identifiziert dein Cluster | role = wer darf sich einloggen und was darf er lesen</text>
</svg>

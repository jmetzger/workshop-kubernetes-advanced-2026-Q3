# Demo-Deployment, das absichtlich wiederholt abstuerzt (CrashLoopBackOff),
# um das Troubleshooting-Szenario "abstuerzender Pod ueber die Zeit" zu demonstrieren.
# Simuliert einen Service, der beim Start seine Datenbank nicht erreicht.
#
# kubectl apply -f 02-crashloop-demo.yml -n crashloop-demo

apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
        - name: payment-service
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "$(date -Iseconds) INFO  payment-service startet..."
              echo "$(date -Iseconds) INFO  Verbinde zu Datenbank db-payments.internal:5432 ..."
              sleep 2
              echo "$(date -Iseconds) ERROR Verbindung zu db-payments.internal:5432 fehlgeschlagen: Connection refused"
              echo "$(date -Iseconds) ERROR payment-service kann ohne Datenbankverbindung nicht starten, beende Prozess"
              exit 1

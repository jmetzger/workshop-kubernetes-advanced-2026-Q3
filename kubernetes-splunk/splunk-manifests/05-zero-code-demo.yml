# Demo-Service fuer Zero-Code-Instrumentierung ueber den OpenTelemetry Operator.
# Die Annotation "instrumentation.opentelemetry.io/inject-python: true" ist der einzige
# Unterschied zu einem ganz normalen Deployment - kein Code, kein Custom-Image noetig.
#
# kubectl apply -f 05-zero-code-demo.yml -n zero-code-demo

apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: checkout-service
  template:
    metadata:
      labels:
        app: checkout-service
      annotations:
        # Muss explizit auf Namespace/Name der Instrumentation-CR zeigen, da diese im
        # Namespace des Forwarders (splunk-forwarder) liegt, nicht im Namespace der App.
        instrumentation.opentelemetry.io/inject-python: "splunk-forwarder/splunk-log-forwarder-splunk-otel-collector"
    spec:
      containers:
        - name: checkout-service
          image: python:3.12-slim
          command:
            - sh
            - -c
            - |
              pip install --quiet flask==3.0.3
              cat <<'PYEOF' > /tmp/app.py
              from flask import Flask
              import random, time
              app = Flask(__name__)

              @app.route("/checkout")
              def checkout():
                  time.sleep(random.uniform(0.05, 0.3))
                  return {"status": "ok", "order_id": random.randint(1000, 9999)}

              app.run(host="0.0.0.0", port=5000)
              PYEOF
              python3 /tmp/app.py
          ports:
            - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: checkout-service
spec:
  selector:
    app: checkout-service
  ports:
    - port: 5000
      targetPort: 5000

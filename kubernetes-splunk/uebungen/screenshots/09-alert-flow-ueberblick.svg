<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Diagramm: kubelet zaehlt jeden BackOff selbst (k8s.event.count). Die Splunk-Suche prueft k8s.event.count>2. Beim Speichern als geplante Benachrichtigung (Cron alle 5 Minuten, Trigger Anzahl Ergebnisse>0, Einschraenkung 30 Minuten) wertet Splunk das regelmaessig aus. Ergebnis: eine ausgeloeste Benachrichtigung, sichtbar nur innerhalb von Splunk, kein E-Mail-Versand.">
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-indigo" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4f46e5"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="260" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Vom BackOff-Zaehler zur Benachrichtigung: wie der Alert entsteht</text>

  <!-- Box 1: kubelet counts BackOff -->
  <rect x="30" y="90" width="208" height="140" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="134" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">kubelet</text>
  <text x="134" y="128" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">zaehlt jeden BackOff</text>
  <text x="134" y="152" text-anchor="middle" font-size="9.5" fill="#7f1d1d">"Back-off restarting</text>
  <text x="134" y="166" text-anchor="middle" font-size="9.5" fill="#7f1d1d">failed container ...</text>
  <text x="134" y="180" text-anchor="middle" font-size="9.5" fill="#7f1d1d">(x1123 over 45m)"</text>
  <text x="134" y="210" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">k8s.event.count</text>
  <text x="134" y="224" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">waechst mit</text>

  <!-- Box 2: Splunk search -->
  <rect x="268" y="90" width="208" height="140" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.5"/>
  <text x="372" y="110" text-anchor="middle" font-size="11.5" font-weight="700" fill="#3730a3">Splunk-Suche</text>
  <text x="372" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#3730a3">(Schritt 1)</text>
  <text x="372" y="146" text-anchor="middle" font-size="9.5" fill="#3730a3">sourcetype=kube:events</text>
  <text x="372" y="160" text-anchor="middle" font-size="9.5" fill="#3730a3">k8s.event.reason=BackOff</text>
  <text x="372" y="174" text-anchor="middle" font-size="9.5" fill="#3730a3">k8s.event.count&gt;2</text>
  <text x="372" y="203" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3730a3">Schwelle</text>
  <text x="372" y="217" text-anchor="middle" font-size="10.5" font-weight="700" fill="#3730a3">ueberschritten</text>

  <!-- Box 3: save as scheduled alert -->
  <rect x="506" y="90" width="208" height="140" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="610" y="110" text-anchor="middle" font-size="11.5" font-weight="700" fill="#92400e">Als Benachrichtigung</text>
  <text x="610" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#92400e">speichern (Schritt 2-4)</text>
  <text x="610" y="146" text-anchor="middle" font-size="9.5" fill="#78350f">Geplant, Cron */5 * * * *</text>
  <text x="610" y="160" text-anchor="middle" font-size="9.5" fill="#78350f">Trigger: Ergebnisse &gt; 0</text>
  <text x="610" y="174" text-anchor="middle" font-size="9.5" fill="#78350f">Einschraenkung: 30 Min</text>
  <text x="610" y="203" text-anchor="middle" font-size="10.5" font-weight="700" fill="#d97706">Alert wird alle</text>
  <text x="610" y="217" text-anchor="middle" font-size="10.5" font-weight="700" fill="#d97706">5 Min ausgewertet</text>

  <!-- Box 4: result -->
  <rect x="744" y="90" width="208" height="140" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="848" y="110" text-anchor="middle" font-size="11.5" font-weight="700" fill="#166534">Ergebnis</text>
  <text x="848" y="124" text-anchor="middle" font-size="10" font-weight="700" fill="#166534">(Schritt 5)</text>
  <text x="848" y="146" text-anchor="middle" font-size="9.5" fill="#14532d">Ausgeloeste</text>
  <text x="848" y="160" text-anchor="middle" font-size="9.5" fill="#14532d">Benachrichtigungen:</text>
  <text x="848" y="174" text-anchor="middle" font-size="9.5" fill="#14532d">Schweregrad, Zeitpunkt</text>
  <text x="848" y="203" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16a34a">sichtbar nur</text>
  <text x="848" y="217" text-anchor="middle" font-size="10.5" font-weight="700" fill="#16a34a">innerhalb Splunk</text>

  <!-- Arrows -->
  <line x1="238" y1="160" x2="266" y2="160" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="252" y="145" text-anchor="middle" font-size="9" fill="#991b1b">zaehlt</text>

  <line x1="476" y1="160" x2="504" y2="160" stroke="#4f46e5" stroke-width="1.8" marker-end="url(#arrow-indigo)"/>
  <text x="490" y="145" text-anchor="middle" font-size="9" fill="#3730a3">&gt; 2</text>

  <line x1="714" y1="160" x2="742" y2="160" stroke="#d97706" stroke-width="1.8" marker-end="url(#arrow-amber)"/>
  <text x="728" y="145" text-anchor="middle" font-size="9" fill="#92400e">feuert</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" role="img" aria-label="Diagramm: In beiden Varianten liest ein Log-Forwarder im Kubernetes-Cluster Container-Logs und sendet sie per HEC weiter. In Variante A bleibt dieser Aufruf innerhalb des Clusters an eine dort laufende Splunk-Standalone-Instanz, verwaltet von CRDs und dem Splunk Operator. In Variante B verlaesst der Aufruf den Cluster und geht an eine externe Splunk-Instanz auf eigener Infrastruktur.">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#1A2420"/>
    </marker>
    <marker id="arrow-b" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#C77D2E"/>
    </marker>
    <marker id="arrow-a" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#3E5C8A"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="560" fill="#FFFFFF"/>

  <!-- Cluster boundary -->
  <rect x="30" y="40" width="430" height="480" rx="14" fill="none" stroke="#1A2420" stroke-opacity="0.35" stroke-width="1.5" stroke-dasharray="7,5"/>
  <text x="50" y="66" font-family="'IBM Plex Mono', ui-monospace, monospace" font-size="13" font-weight="700" fill="#1A2420">KUBERNETES-CLUSTER</text>

  <!-- Pods -->
  <rect x="55" y="90" width="150" height="60" rx="8" fill="none" stroke="#1A2420" stroke-width="1.3"/>
  <text x="130" y="115" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#1A2420">Deine Pods</text>
  <text x="130" y="133" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#5C665F">stdout / stderr</text>

  <line x1="130" y1="150" x2="130" y2="185" stroke="#1A2420" stroke-width="1.3" marker-end="url(#arrow)"/>

  <!-- Forwarder -->
  <rect x="55" y="188" width="150" height="64" rx="8" fill="none" stroke="#1A2420" stroke-width="1.6"/>
  <text x="130" y="213" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="700" fill="#1A2420">Log-Forwarder</text>
  <text x="130" y="230" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#5C665F">DaemonSet, 1x pro Node</text>
  <text x="130" y="244" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#8A938C">-- identisch in A &amp; B --</text>

  <!-- Variant A: stays inside cluster -->
  <line x1="205" y1="200" x2="290" y2="150" stroke="#3E5C8A" stroke-width="1.6" marker-end="url(#arrow-a)"/>
  <text x="260" y="163" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#3E5C8A">HEC (bleibt im Cluster)</text>

  <rect x="290" y="90" width="150" height="90" rx="8" fill="#E4EAF3" stroke="#3E5C8A" stroke-width="1.6"/>
  <text x="365" y="112" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700" fill="#3E5C8A">VARIANTE A</text>
  <text x="365" y="130" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="12" font-weight="600" fill="#1A2420">Splunk Standalone</text>
  <text x="365" y="146" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#5C665F">Pod . StatefulSet</text>
  <text x="365" y="160" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#5C665F">Web-UI :8000</text>

  <!-- Operator manages A -->
  <rect x="290" y="255" width="150" height="52" rx="8" fill="none" stroke="#3E5C8A" stroke-width="1.3" stroke-dasharray="3,3"/>
  <text x="365" y="277" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11.5" font-weight="600" fill="#1A2420">Splunk Operator</text>
  <text x="365" y="293" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#5C665F">+ CRDs</text>
  <line x1="365" y1="255" x2="365" y2="180" stroke="#3E5C8A" stroke-width="1.3" stroke-dasharray="3,3" marker-end="url(#arrow-a)"/>
  <text x="378" y="220" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#3E5C8A">erzeugt</text>

  <!-- Variant B: leaves cluster -->
  <line x1="205" y1="230" x2="470" y2="420" stroke="#C77D2E" stroke-width="1.6" stroke-dasharray="6,4" marker-end="url(#arrow-b)"/>
  <text x="330" y="345" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#C77D2E">HEC (verlaesst den Cluster)</text>

  <circle cx="460" cy="330" r="4" fill="#C77D2E"/>

  <!-- External Splunk box -->
  <rect x="490" y="360" width="220" height="150" rx="10" fill="#F4E4CE" stroke="#C77D2E" stroke-width="1.6"/>
  <text x="600" y="386" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" font-weight="700" fill="#C77D2E">VARIANTE B</text>
  <text x="600" y="406" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="13" font-weight="600" fill="#1A2420">Splunk Standalone</text>
  <text x="600" y="424" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#5C665F">eigener Server / VM</text>
  <text x="600" y="440" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#5C665F">ausserhalb des Clusters</text>
  <text x="600" y="460" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#5C665F">HEC :8088</text>
  <text x="600" y="476" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#5C665F">Web-UI :8000 (hinter Reverse-Proxy)</text>

  <!-- other clusters feeding same external splunk -->
  <rect x="770" y="360" width="160" height="60" rx="8" fill="none" stroke="#1A2420" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.55"/>
  <text x="850" y="386" text-anchor="middle" font-family="'IBM Plex Sans', sans-serif" font-size="11" fill="#1A2420" opacity="0.65">weiterer Cluster</text>
  <text x="850" y="402" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="9.5" fill="#1A2420" opacity="0.5">eigener Forwarder</text>
  <line x1="770" y1="410" x2="712" y2="420" stroke="#1A2420" stroke-width="1.2" stroke-dasharray="4,4" opacity="0.55" marker-end="url(#arrow)"/>

  <text x="50" y="480" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#8A938C">Zugriff auf Web-UI: kubectl port-forward</text>
  <text x="490" y="535" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#8A938C">Zugriff auf Web-UI: SSH-Tunnel oder Reverse-Proxy + TLS</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 690" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#c2670f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Splunk auf Kubernetes - Variante B: Splunk extern</text>

  <!-- Browser -->
  <rect x="20" y="500" width="180" height="90" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="110" y="530" text-anchor="middle" font-size="13" font-weight="600" fill="#0f172a">Dein Browser</text>
  <text x="110" y="550" text-anchor="middle" font-size="11" fill="#475569">https://splunk-external</text>
  <text x="110" y="566" text-anchor="middle" font-size="11" fill="#475569">.do.t3isp.de</text>

  <!-- Kubernetes cluster -->
  <rect x="230" y="60" width="380" height="500" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="420" y="85" text-anchor="middle" font-size="14" font-weight="700" fill="#334155">DOKS-Cluster "splunk-training"</text>

  <!-- Namespace splunk-forwarder -->
  <rect x="255" y="105" width="330" height="140" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="420" y="125" text-anchor="middle" font-size="12" font-weight="700" fill="#3730a3">Namespace: splunk-forwarder</text>
  <rect x="275" y="140" width="290" height="90" rx="6" fill="#ffffff" stroke="#6366f1" stroke-width="1.2"/>
  <text x="420" y="163" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Log-Forwarder (splunk-otel-collector)</text>
  <text x="420" y="181" text-anchor="middle" font-size="10.5" fill="#475569">DaemonSet - 1 Agent-Pod pro Node</text>
  <text x="420" y="197" text-anchor="middle" font-size="10.5" fill="#475569">liest /var/log/pods/*/*.log</text>
  <text x="420" y="213" text-anchor="middle" font-size="10.5" fill="#475569">kein Operator, kein Splunk im Cluster</text>

  <!-- Namespace crashloop-demo -->
  <rect x="255" y="265" width="330" height="140" rx="8" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="420" y="285" text-anchor="middle" font-size="12" font-weight="700" fill="#991b1b">Namespace: crashloop-demo</text>
  <rect x="275" y="300" width="290" height="90" rx="6" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/>
  <text x="420" y="323" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">payment-service Pod</text>
  <text x="420" y="341" text-anchor="middle" font-size="10.5" fill="#475569">CrashLoopBackOff</text>
  <text x="420" y="357" text-anchor="middle" font-size="10.5" fill="#475569">"DB nicht erreichbar" -&gt;</text>
  <text x="420" y="373" text-anchor="middle" font-size="10.5" fill="#475569">exit 1, Neustart, wiederholt</text>

  <!-- Node filesystem -->
  <rect x="255" y="425" width="330" height="70" rx="8" fill="#fffbeb" stroke="#d97706" stroke-width="1.5"/>
  <text x="420" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="#92400e">Node-Dateisystem</text>
  <text x="420" y="466" text-anchor="middle" font-size="10.5" fill="#78350f">/var/log/pods/&lt;namespace&gt;_&lt;pod&gt;/</text>
  <text x="420" y="482" text-anchor="middle" font-size="10.5" fill="#78350f">stdout/stderr aller Container</text>

  <!-- Kubernetes API -->
  <rect x="255" y="510" width="330" height="50" rx="8" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="420" y="530" text-anchor="middle" font-size="12" font-weight="700" fill="#166534">Kubernetes API</text>
  <text x="420" y="546" text-anchor="middle" font-size="10.5" fill="#14532d">Events (BackOff, Scheduled, ...)</text>

  <!-- External VM box -->
  <rect x="655" y="105" width="300" height="300" rx="10" fill="#fff7ed" stroke="#c2670f" stroke-width="1.8"/>
  <text x="805" y="128" text-anchor="middle" font-size="13" font-weight="700" fill="#9a4f0a">VM "splunk-external" (ausserhalb des Clusters)</text>

  <rect x="675" y="145" width="260" height="70" rx="6" fill="#ffffff" stroke="#c2670f" stroke-width="1.4"/>
  <text x="805" y="167" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Nginx Reverse-Proxy</text>
  <text x="805" y="184" text-anchor="middle" font-size="10.5" fill="#475569">:80 / :443, Let's-Encrypt-Zertifikat</text>
  <text x="805" y="200" text-anchor="middle" font-size="10.5" fill="#475569">proxy_pass -&gt; 127.0.0.1:8000</text>

  <rect x="675" y="230" width="260" height="115" rx="6" fill="#ffffff" stroke="#c2670f" stroke-width="1.4"/>
  <text x="805" y="252" text-anchor="middle" font-size="12" font-weight="600" fill="#0f172a">Splunk Standalone (nativ)</text>
  <text x="805" y="270" text-anchor="middle" font-size="10.5" fill="#475569">.deb-Installation, kein Docker</text>
  <text x="805" y="286" text-anchor="middle" font-size="10.5" fill="#475569">Web-UI :8000 (nur intern/localhost)</text>
  <text x="805" y="302" text-anchor="middle" font-size="10.5" fill="#475569">HEC :8088 (oeffentlich, Token-Schutz)</text>
  <text x="805" y="318" text-anchor="middle" font-size="10.5" fill="#475569">Index "main"</text>
  <text x="805" y="334" text-anchor="middle" font-size="10.5" fill="#475569">Admin-Passwort + HEC-Token: selbst</text>
  <text x="805" y="348" text-anchor="middle" font-size="10.5" fill="#475569">gewaehlt via Terraform-Variablen</text>

  <!-- Terraform / cloud-init provisioning note -->
  <rect x="655" y="425" width="300" height="70" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="805" y="448" text-anchor="middle" font-size="12" font-weight="700" fill="#334155">Terraform + Cloud-Init</text>
  <text x="805" y="466" text-anchor="middle" font-size="10.5" fill="#475569">provisioniert die VM einmalig,</text>
  <text x="805" y="482" text-anchor="middle" font-size="10.5" fill="#475569">danach kein Operator noetig</text>
  <line x1="805" y1="425" x2="805" y2="405" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- Arrows -->
  <!-- payment-service -> node fs -->
  <line x1="420" y1="390" x2="420" y2="423" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="475" y="410" text-anchor="middle" font-size="9.5" fill="#92400e">stdout</text>

  <!-- k8s API -> forwarder (events) -->
  <line x1="330" y1="510" x2="300" y2="247" stroke="#16a34a" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="270" y="380" text-anchor="middle" font-size="9.5" fill="#166534" transform="rotate(-90 270 380)">Events</text>

  <!-- node fs -> forwarder -->
  <line x1="420" y1="425" x2="420" y2="247" stroke="#d97706" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text x="470" y="335" text-anchor="middle" font-size="9.5" fill="#78350f">tailt Logs</text>

  <!-- forwarder -> HEC (crosses cluster boundary, public internet) -->
  <path d="M585,170 C 620,170 620,255 653,255" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="600" y="150" text-anchor="middle" font-size="9.5" fill="#1d4ed8">HEC POST https :8088</text>
  <text x="600" y="235" text-anchor="middle" font-size="9" fill="#1d4ed8" opacity="0.8">(oeffentliches Internet,</text>
  <text x="600" y="248" text-anchor="middle" font-size="9" fill="#1d4ed8" opacity="0.8">nicht VPC-privat)</text>

  <!-- browser -> nginx (routed below and around the cluster box, not through it) -->
  <path d="M200,555 C 420,600 615,600 630,400 C 634,320 645,240 673,190" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="420" y="610" text-anchor="middle" font-size="9.5" fill="#1d4ed8">HTTPS :443 (echtes Zertifikat, kein Tunnel noetig)</text>

  <!-- Legend -->
  <rect x="230" y="630" width="700" height="55" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="245" y1="648" x2="270" y2="648" stroke="#2563eb" stroke-width="2"/>
  <text x="276" y="652" font-size="10.5" fill="#0f172a">Zugriff / Log-Versand (HEC, HTTPS)</text>
  <line x1="500" y1="648" x2="525" y2="648" stroke="#d97706" stroke-width="1.6"/>
  <text x="531" y="652" font-size="10.5" fill="#0f172a">Container-Logs</text>
  <line x1="245" y1="668" x2="270" y2="668" stroke="#16a34a" stroke-width="1.6"/>
  <text x="276" y="672" font-size="10.5" fill="#0f172a">Kubernetes-Events</text>
  <line x1="500" y1="668" x2="525" y2="668" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4,3"/>
  <text x="531" y="672" font-size="10.5" fill="#0f172a">Einmalige Provisionierung</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 360" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="360" fill="#ffffff"/>

  <!-- Title -->
  <text x="490" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Warum ein Log-Forwarder: der Weg eines Log-Eintrags</text>

  <!-- Step 1: Container -->
  <rect x="30" y="90" width="180" height="110" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text x="120" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#0f172a">1. Container</text>
  <text x="120" y="138" text-anchor="middle" font-size="10.5" fill="#475569">schreibt Log-Zeile nach</text>
  <text x="120" y="154" text-anchor="middle" font-size="10.5" fill="#475569">stdout / stderr</text>

  <!-- Step 2: Node filesystem (danger) -->
  <rect x="270" y="90" width="200" height="130" rx="8" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/>
  <text x="370" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#991b1b">2. Node-Dateisystem</text>
  <text x="370" y="138" text-anchor="middle" font-size="10.5" fill="#7f1d1d">/var/log/pods/.../*.log</text>
  <text x="370" y="156" text-anchor="middle" font-size="10.5" fill="#7f1d1d">nur temporaer, wird von</text>
  <text x="370" y="172" text-anchor="middle" font-size="10.5" fill="#7f1d1d">containerd rotiert</text>
  <text x="370" y="196" text-anchor="middle" font-size="10.5" font-weight="700" fill="#dc2626">Pod-Neustart -&gt; weg</text>

  <!-- Step 3: Forwarder -->
  <rect x="530" y="90" width="220" height="130" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="640" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#3730a3">3. Log-Forwarder</text>
  <text x="640" y="138" text-anchor="middle" font-size="10.5" fill="#3730a3">Splunk OpenTelemetry</text>
  <text x="640" y="154" text-anchor="middle" font-size="10.5" fill="#3730a3">Collector, als DaemonSet</text>
  <text x="640" y="170" text-anchor="middle" font-size="10.5" fill="#3730a3">-&gt; 1 Pod pro Node</text>
  <text x="640" y="192" text-anchor="middle" font-size="10.5" fill="#3730a3">liest laufend mit (tail)</text>

  <!-- Step 4: Splunk external -->
  <rect x="800" y="90" width="150" height="130" rx="8" fill="#fff7ed" stroke="#c2670f" stroke-width="1.5"/>
  <text x="875" y="115" text-anchor="middle" font-size="13" font-weight="700" fill="#9a4f0a">4. Splunk</text>
  <text x="875" y="138" text-anchor="middle" font-size="10.5" fill="#7c3a08">externe VM,</text>
  <text x="875" y="154" text-anchor="middle" font-size="10.5" fill="#7c3a08">Uebung 2</text>
  <text x="875" y="176" text-anchor="middle" font-size="10.5" font-weight="700" fill="#9a4f0a">sicher gespeichert</text>

  <!-- Arrows between steps -->
  <line x1="210" y1="145" x2="268" y2="145" stroke="#334155" stroke-width="1.8" marker-end="url(#arrow)"/>

  <line x1="470" y1="145" x2="528" y2="145" stroke="#dc2626" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <text x="499" y="130" text-anchor="middle" font-size="9.5" fill="#991b1b">bevor weg</text>

  <line x1="750" y1="145" x2="798" y2="145" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="774" y="130" text-anchor="middle" font-size="9.5" fill="#1d4ed8">HEC</text>
  <text x="774" y="180" text-anchor="middle" font-size="9" fill="#1d4ed8">Port 8088</text>

  <!-- Legend / takeaway -->
  <rect x="30" y="255" width="920" height="75" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="50" y="280" font-size="11.5" fill="#334155">Ohne Forwarder: Logs liegen nur kurz auf dem Node und sind nach Neustart/Node-Wechsel verloren.</text>
  <text x="50" y="300" font-size="11.5" fill="#334155">Diese Uebung installiert den Forwarder (Schritt 2-3) und richtet ihn auf den HEC (HTTP Event</text>
  <text x="50" y="318" font-size="11.5" fill="#334155">Collector) der externen VM aus Uebung 2 aus (Schritt 1-3 unten).</text>
</svg>

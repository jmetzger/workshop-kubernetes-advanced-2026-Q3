<svg viewBox="0 0 920 430" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="430" fill="#ffffff"/>

  <text x="20" y="30" font-size="16" font-weight="bold" fill="#111827">KEDA: zwei Wege zu einer eigenen Skalierungs-Metrik</text>

  <!-- Lane A -->
  <text x="20" y="62" font-size="13" font-weight="bold" fill="#1e3a8a">Bisherige Uebung: prometheus-Scaler</text>

  <rect x="20" y="75" width="150" height="60" rx="6" fill="#eef2ff" stroke="#4338ca"/>
  <text x="95" y="100" font-size="12" text-anchor="middle" fill="#1e293b">App-Pods +</text>
  <text x="95" y="116" font-size="12" text-anchor="middle" fill="#1e293b">php-fpm_exporter</text>

  <rect x="210" y="75" width="140" height="60" rx="6" fill="#eef2ff" stroke="#4338ca"/>
  <text x="280" y="100" font-size="12" text-anchor="middle" fill="#1e293b">ServiceMonitor</text>
  <text x="280" y="116" font-size="12" text-anchor="middle" fill="#1e293b">(scrape alle 15s)</text>

  <rect x="390" y="75" width="140" height="60" rx="6" fill="#eef2ff" stroke="#4338ca"/>
  <text x="460" y="100" font-size="12" text-anchor="middle" fill="#1e293b">Prometheus</text>
  <text x="460" y="116" font-size="12" text-anchor="middle" fill="#1e293b">(Zeitreihen, alle Pods)</text>

  <rect x="570" y="75" width="110" height="60" rx="6" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="625" y="100" font-size="12" text-anchor="middle" fill="#1e293b">KEDA</text>
  <text x="625" y="116" font-size="12" text-anchor="middle" fill="#1e293b">PromQL: avg(...)</text>

  <rect x="720" y="75" width="90" height="60" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="765" y="100" font-size="12" text-anchor="middle" fill="#1e293b">HPA</text>
  <text x="765" y="116" font-size="11" text-anchor="middle" fill="#64748b">(von KEDA erzeugt)</text>

  <rect x="820" y="75" width="90" height="60" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="865" y="100" font-size="12" text-anchor="middle" fill="#1e293b">Deployment</text>
  <text x="865" y="116" font-size="11" text-anchor="middle" fill="#64748b">skaliert</text>

  <path d="M170,105 H210" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M350,105 H390" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M530,105 H570" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M680,105 H720" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M810,105 H820" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="20" y1="165" x2="900" y2="165" stroke="#e5e7eb" stroke-width="1"/>
  <text x="460" y="185" font-size="12" text-anchor="middle" fill="#94a3b8">vs.</text>

  <!-- Lane B -->
  <text x="20" y="222" font-size="13" font-weight="bold" fill="#166534">Diese Uebung: metrics-api-Scaler</text>

  <rect x="20" y="235" width="220" height="70" rx="6" fill="#ecfdf5" stroke="#15803d"/>
  <text x="130" y="258" font-size="12" text-anchor="middle" fill="#1e293b">Nextcloud (ein Pod)</text>
  <text x="130" y="274" font-size="11" text-anchor="middle" fill="#1e293b">/ocs/.../serverinfo</text>
  <text x="130" y="290" font-size="11" text-anchor="middle" fill="#1e293b">?format=json + Basic-Auth</text>

  <rect x="390" y="235" width="110" height="70" rx="6" fill="#dcfce7" stroke="#15803d"/>
  <text x="445" y="264" font-size="12" text-anchor="middle" fill="#1e293b">KEDA</text>
  <text x="445" y="280" font-size="11" text-anchor="middle" fill="#1e293b">HTTP GET direkt</text>
  <text x="445" y="294" font-size="11" text-anchor="middle" fill="#1e293b">(metrics-api)</text>

  <rect x="570" y="235" width="110" height="70" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="625" y="264" font-size="12" text-anchor="middle" fill="#1e293b">HPA</text>
  <text x="625" y="280" font-size="11" text-anchor="middle" fill="#64748b">(von KEDA erzeugt)</text>

  <rect x="750" y="235" width="110" height="70" rx="6" fill="#f1f5f9" stroke="#475569"/>
  <text x="805" y="264" font-size="12" text-anchor="middle" fill="#1e293b">Deployment</text>
  <text x="805" y="280" font-size="11" text-anchor="middle" fill="#64748b">skaliert</text>

  <path d="M390,270 H240" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="310" y="262" font-size="10" text-anchor="middle" fill="#64748b">Antwort (JSON)</text>
  <path d="M500,270 H570" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M680,270 H750" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- entfaellt box -->
  <rect x="20" y="330" width="440" height="40" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/>
  <text x="240" y="354" font-size="12" text-anchor="middle" fill="#64748b">entfaellt: Exporter, ServiceMonitor, Prometheus - KEDA fragt die App direkt</text>

  <rect x="480" y="330" width="420" height="60" rx="6" fill="#fffbeb" stroke="#d97706"/>
  <text x="500" y="350" font-size="11" fill="#92400e">Generelle Grenze von metrics-api: fragt immer nur EINEN</text>
  <text x="500" y="365" font-size="11" fill="#92400e">Pod (Service-Loadbalancing) - keine Fleet-Aggregation wie</text>
  <text x="500" y="380" font-size="11" fill="#92400e">avg() in PromQL. Bei serverinfo egal, siehe Diagramm 2.</text>
</svg>

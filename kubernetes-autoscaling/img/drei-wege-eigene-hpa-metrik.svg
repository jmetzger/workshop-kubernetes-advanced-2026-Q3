<svg viewBox="0 0 940 400" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="940" height="400" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#111827">Drei Wege zu HPA mit eigener Metrik</text>

  <!-- Row 1 -->
  <text x="20" y="58" font-size="12" font-weight="bold" fill="#1e3a8a">1. KEDA + prometheus-Scaler</text>
  <rect x="20" y="68" width="150" height="44" rx="5" fill="#eef2ff" stroke="#4338ca"/>
  <text x="95" y="94" font-size="11" text-anchor="middle" fill="#1e293b">App-Pods + Exporter</text>
  <rect x="190" y="68" width="130" height="44" rx="5" fill="#eef2ff" stroke="#4338ca"/>
  <text x="255" y="94" font-size="11" text-anchor="middle" fill="#1e293b">Prometheus</text>
  <rect x="340" y="68" width="100" height="44" rx="5" fill="#dbeafe" stroke="#1d4ed8"/>
  <text x="390" y="94" font-size="11" text-anchor="middle" fill="#1e293b">KEDA</text>
  <rect x="460" y="68" width="90" height="44" rx="5" fill="#f1f5f9" stroke="#475569"/>
  <text x="505" y="94" font-size="11" text-anchor="middle" fill="#1e293b">HPA</text>
  <text x="20" y="128" font-size="10" fill="#64748b">braucht: Exporter + ServiceMonitor + Prometheus + KEDA</text>

  <path d="M170,90 H190" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow3)"/>
  <path d="M320,90 H340" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow3)"/>
  <path d="M440,90 H460" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <line x1="20" y1="148" x2="920" y2="148" stroke="#e5e7eb"/>

  <!-- Row 2 -->
  <text x="20" y="172" font-size="12" font-weight="bold" fill="#166534">2. KEDA + metrics-api-Scaler</text>
  <rect x="20" y="182" width="150" height="44" rx="5" fill="#ecfdf5" stroke="#15803d"/>
  <text x="95" y="208" font-size="11" text-anchor="middle" fill="#1e293b">Nextcloud (1 Pod)</text>
  <rect x="340" y="182" width="100" height="44" rx="5" fill="#dcfce7" stroke="#15803d"/>
  <text x="390" y="208" font-size="11" text-anchor="middle" fill="#1e293b">KEDA</text>
  <rect x="460" y="182" width="90" height="44" rx="5" fill="#f1f5f9" stroke="#475569"/>
  <text x="505" y="208" font-size="11" text-anchor="middle" fill="#1e293b">HPA</text>
  <text x="20" y="242" font-size="10" fill="#64748b">braucht: KEDA, kein Prometheus - aber nur 1 zufaelliger Pod</text>

  <path d="M340,204 H170" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow3)"/>
  <path d="M440,204 H460" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <line x1="20" y1="262" x2="920" y2="262" stroke="#e5e7eb"/>

  <!-- Row 3 -->
  <text x="20" y="286" font-size="12" font-weight="bold" fill="#9a3412">3. Eigener External-Metrics-Server (diese Uebung)</text>

  <rect x="20" y="296" width="80" height="34" rx="5" fill="#ffedd5" stroke="#c2410c"/>
  <text x="60" y="317" font-size="10" text-anchor="middle" fill="#1e293b">Pod A</text>
  <rect x="20" y="336" width="80" height="34" rx="5" fill="#ffedd5" stroke="#c2410c"/>
  <text x="60" y="357" font-size="10" text-anchor="middle" fill="#1e293b">Pod B</text>
  <rect x="20" y="376" width="80" height="18" rx="4" fill="#fff7ed" stroke="#c2410c" stroke-dasharray="3 2"/>
  <text x="60" y="389" font-size="9" text-anchor="middle" fill="#9a3412">... alle Pods</text>

  <rect x="160" y="316" width="180" height="44" rx="5" fill="#ffedd5" stroke="#c2410c"/>
  <text x="250" y="336" font-size="11" text-anchor="middle" fill="#1e293b">eigener Adapter</text>
  <text x="250" y="350" font-size="10" text-anchor="middle" fill="#1e293b">listet Pods, fragt jeden ab, summiert</text>

  <rect x="400" y="316" width="150" height="44" rx="5" fill="#fed7aa" stroke="#c2410c"/>
  <text x="475" y="336" font-size="11" text-anchor="middle" fill="#1e293b">APIService</text>
  <text x="475" y="350" font-size="10" text-anchor="middle" fill="#1e293b">external.metrics.k8s.io</text>

  <rect x="610" y="316" width="90" height="44" rx="5" fill="#f1f5f9" stroke="#475569"/>
  <text x="655" y="341" font-size="11" text-anchor="middle" fill="#1e293b">HPA</text>

  <path d="M100,313 Q130,320 160,330" stroke="#475569" stroke-width="1.2" fill="none" marker-end="url(#arrow3)"/>
  <path d="M100,353 Q130,345 160,340" stroke="#475569" stroke-width="1.2" fill="none" marker-end="url(#arrow3)"/>
  <path d="M340,338 H400" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow3)"/>
  <path d="M550,338 H610" stroke="#475569" stroke-width="1.3" marker-end="url(#arrow3)"/>

  <text x="740" y="330" font-size="10" fill="#64748b">kein Prometheus,</text>
  <text x="740" y="344" font-size="10" fill="#64748b">kein KEDA - dafuer</text>
  <text x="740" y="358" font-size="10" fill="#64748b">selbst RBAC + API</text>
  <text x="740" y="372" font-size="10" fill="#64748b">registrieren</text>
</svg>
